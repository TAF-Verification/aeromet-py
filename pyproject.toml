[tool.poetry]
name = "aeromet-py"
version = "0.1.2"
description = "Python library to parse meteorological information of aeronautical stations."
readme = "README.md"
authors = ["diego-garro <diego.garromolina@yahoo.com>"]
license = "MIT"
documentation = "https://github.com/TAF-Verification/aeromet-py/blob/main/doc/docs.md"
repository = "https://github.com/TAF-Verification/aeromet-py"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

[tool.poetry.group.dev.dependencies]
coverage = "^6.4.4"
pytest = "^7.1.3"
black = "^26.5.1"
isort = "^8.0.1"
mypy = "^0.971"
bump2version = "^1.0.1"
codecov = "^2.1.13"
metar = "^1.11.0"
pint = "0.21.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
